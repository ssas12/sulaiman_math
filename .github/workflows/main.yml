
name: Build Math App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup ZIP tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Extract Math App
        run: |
          mkdir -p extracted output
          unzip -o sulaiman_math_enhanced.zip -d extracted

      - name: Prepare app package
        run: |
          zip -r output/Math-App.zip extracted

      - name: Upload Math App
        uses: actions/upload-artifact@v4
        with:
          name: Math-App
          path: output/Math-App.zip
