
name: Build Math App


on:
  workflow_dispatch:
  push:
    branches:
      - main
      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Math App
        run: |
          mkdir -p output
          cp sulaiman_math_project_ready.zip output/Math-App.zip

      - name: Upload Math App
        uses: actions/upload-artifact@v4
        with:
          name: Math-App
          path: output/Math-App.zip
