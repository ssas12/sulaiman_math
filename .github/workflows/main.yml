
name: Build Sulaiman Math v6

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read


jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
    run: yes | sdkmanager --licenses || true

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract HTML project
    run: |
      set -e
      ZIP="$(find . -maxdepth 2 -type f -name 'sulaiman_math_enhanced_v2.zip' | head -n 1)"
      if [ -z "$ZIP" ]; then
        echo "ERROR: Project ZIP not found"
        exit 1
      fi
      mkdir -p html_project
      unzip -o "$ZIP" -d html_project

  - name: Create Android project
    run: |
      echo "ضع هنا خطوات إنشاء مشروع Android الموجودة في كودك السابق"

  - name: Build APK
    run: |
      echo "ضع هنا أمر بناء APK الموجود في كودك السابق"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Sulaiman-Math-v6-APK
      path: app/build/outputs/apk/**/*.apk
      if-no-files-found: error
