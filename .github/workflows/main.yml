
name: Build Math APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/sulaiman/math

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SulaimanMath"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sulaiman.math'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sulaiman.math'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

      - name: Extract HTML project
        run: |
          ZIP=$(find . -maxdepth 2 \
            -name 'sulaiman_math_enhanced_v2.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          unzip -o "$ZIP" -d extracted

          HTML=$(find extracted \
            -name 'sulaiman_math_enhanced.html' \
            -print -quit)

          if [ -z "$HTML" ]; then
            echo "HTML file not found"
            exit 1
          fi

          cp "$HTML" app/src/main/assets/index.html

      - name: Create Android Activity
        run: |
          cat > app/src/main/java/com/sulaiman/math/MainActivity.java <<'EOF'
          package com.sulaiman.math;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);

                  WebSettings settings =
                      web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(
                      new WebViewClient()
                  );

                  setContentView(web);

                  web.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  setContentView(new WebView(this));
                  super.onBackPressed();
              }
          }
          EOF

      - name: Create Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="الأستاذ سليمان - الرياضيات"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sulaiman-Math-APK
          path: app/build/outputs/apk/debug/app-debug.apk
