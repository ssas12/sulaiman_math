
name: Build Math APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

  

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"



      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract website
        run: |
          mkdir -p website
          unzip -o sulaiman_math_enhanced.zip -d website

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/sulaiman/math

          cp -r website/sulaiman_math_app_upload/. \
            app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(
              RepositoriesMode.FAIL_ON_PROJECT_REPOS
            )
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "SulaimanMath"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.sulaiman.math'
            compileSdk 35

            defaultConfig {
              applicationId 'com.sulaiman.math'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="الأستاذ سليمان - الرياضيات"
              android:usesCleartextTraffic="true">

              <activity
                android:name="com.sulaiman.math.MainActivity"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sulaiman/math/MainActivity.java <<'EOF'
          package com.sulaiman.math;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              WebView web = new WebView(this);
              WebSettings settings = web.getSettings();

              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);

              web.setWebViewClient(
                new android.webkit.WebViewClient()
              );

              setContentView(web);
              web.loadUrl(
                "file:///android_asset/index.html"
              );
            }

            @Override
            public void onBackPressed() {
              setContentView(new WebView(this));
              finish();
            }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sulaiman-Math-APK
          path: app/build/outputs/apk/debug/app-debug.apk
