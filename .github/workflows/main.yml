
name: Build Sulaiman Math v6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and extract project
        shell: bash
        run: |
          set -e
          echo "Searching for Android project..."

          if [ ! -d app ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE"
              mkdir -p extracted
              unzip -o "$ZIP_FILE" -d extracted

              APP_DIR=$(find extracted -type d -name app | head -n 1)

              if [ -n "$APP_DIR" ]; then
                PROJECT_DIR=$(dirname "$APP_DIR")
                cp -a "$PROJECT_DIR"/. .
              fi
            fi
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory is missing."
            echo "Check the ZIP file and project folder structure."
            find . -maxdepth 3 -type d | head -n 80
            exit 1
          fi

          echo "Android app directory found."

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle assembleDebug --no-daemon
          else
            echo "ERROR: Gradle build file not found."
            exit 1
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=$(find . -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sulaiman-Math-v6-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
